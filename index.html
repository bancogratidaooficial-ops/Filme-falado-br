<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FILME FALADO BR V3</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a0a0f;color:#fff;font-family:Arial}
.top{padding:16px;font-weight:900}
.title{padding:0 16px;font-size:28px;font-weight:900} .title b{color:#ff9c00}
.box{margin:12px;background:#14141f;border-radius:16px;padding:12px;border:1px solid #232334}
.btn{width:100%;padding:16px;border:0;border-radius:14px;font-weight:900;margin-top:8px}
.btn-orange{background:#ff9c00;color:#000}.btn-red{background:#ff0000;color:#fff}
.btn-green{background:#00ff88;color:#000}.btn-dark{background:#222;color:#fff;border:1px solid #444}
#log{margin:12px;background:#000;border:1px solid #333;border-radius:12px;padding:10px;font-size:13px;max-height:400px;overflow:auto;white-space:pre-wrap}
video{width:100%;border-radius:12px;background:#000}
input{width:100%;padding:14px;border-radius:10px;border:1px solid #444;background:#000;color:#fff;margin-top:8px}
</style>
</head>
<body>
<div class="top">🎬 FILME FALADO BR <b style="color:#ff9c00">V3 - CORRIGIDO</b></div>
<div class="title">Agora <b>TRADUZ DE VERDADE</b></div>

<div class="box">
<input type="file" id="fileInput" accept="video/*">
<video id="video" controls playsinline></video>
<button class="btn btn-dark" onclick="testarVoz()">🔊 TESTAR VOZ PT-BR (clique aqui primeiro)</button>
</div>

<div class="box">
<b>1 - TESTE DE TRADUÇÃO MANUAL:</b>
<input id="textoTeste" value="They'll find you no matter what" placeholder="Digite em inglês">
<button class="btn btn-orange" onclick="traduzirManual()">🌎 TRADUZIR AGORA - BOTÃO QUE FUNCIONA</button>
<div id="resultado" style="margin-top:10px;color:#00ff88;font-weight:900;font-size:16px"></div>
</div>

<div class="box">
<b>2 - ESCUTA AO VIVO:</b>
<button class="btn btn-red" id="btnLive" onclick="toggleLive()">🎙️ CLICAR PARA COMEÇAR A ESCUTAR</button>
<div id="log"></div>
</div>

<script>
const logEl=document.getElementById('log');
function log(t){logEl.innerHTML=t+'<br><br>'+logEl.innerHTML}
function falar(texto){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(texto);u.lang='pt-BR';u.rate=1;let vs=speechSynthesis.getVoices();let br=vs.find(v=>v.lang.toLowerCase().includes('pt-br'));if(br)u.voice=br;speechSynthesis.speak(u);}

function testarVoz(){falar('Voz em português do Brasil funcionando! Agora pode traduzir.');log('🔊 Voz pt-BR testada com sucesso!');}

// TRADUÇÃO QUE NÃO FALHA - usa Google Translate direto
async function traduzirGoogle(texto){
try{
let url=`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=pt&dt=t&q=${encodeURIComponent(texto)}`;
let r=await fetch(url); let j=await r.json();
return j[0].map(x=>x[0]).join('');
}catch(e){
try{ // fallback MyMemory
let r2=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(texto)}&langpair=en|pt-BR`);
let j2=await r2.json(); return j2.responseData.translatedText;
}catch(e2){return 'Erro de internet - ative os dados';}
}
}

async function traduzirManual(){
let txt=document.getElementById('textoTeste').value;
if(!txt){alert('Digite algo');return}
document.getElementById('resultado').innerText='Traduzindo...';
let trad=await traduzirGoogle(txt);
document.getElementById('resultado').innerText='🇧🇷 '+trad;
falar(trad);
log('MANUAL:\nEN: '+txt+'\nPT: '+trad);
}

document.getElementById('fileInput').onchange=(e)=>{
let f=e.target.files[0];if(!f)return;
document.getElementById('video').src=URL.createObjectURL(f);
log('📁 Filme carregado: '+f.name);
}

let listening=false, rec;
function toggleLive(){
let btn=document.getElementById('btnLive');
if(!listening){
let SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){alert('Use Chrome no celular');return}
rec=new SR();rec.lang='en-US';rec.continuous=true;rec.interimResults=false;
rec.onstart=()=>{listening=true;btn.innerText='⏹️ PARAR - OUVINDO... FALE ALTO';btn.className='btn btn-green';log('🎙️ OUVINDO - Aumente o volume e deixe o celular perto do som!');}
rec.onend=()=>{if(listening)try{rec.start()}catch(e){}}
rec.onresult=async(ev)=>{
let txt=ev.results[ev.results.length-1][0].transcript;
log('🇺🇸 Escutei: '+txt);
let trad=await traduzirGoogle(txt);
log('🇧🇷 Traduzido: '+trad);
document.getElementById('resultado').innerText=trad;
falar(trad);
}
rec.start();
}else{try{rec.stop()}catch(e){}listening=false;btn.innerText='🎙️ CLICAR PARA COMEÇAR A ESCUTAR';btn.className='btn btn-red';}
}
</script>
</body>
</html>

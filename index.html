<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FILME FALADO BR - TRADUZINDO</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a0a0f;color:#fff;font-family:Arial}
.header{display:flex;align-items:center;gap:12px;padding:16px;background:#0a0a0f;position:sticky;top:0;z-index:10}
.logo{width:48px;height:48px;background:#ff9c00;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px}
.title{padding:0 20px;font-size:32px;font-weight:900;line-height:1.1}.title b{color:#ff9c00}
.desc{padding:14px 20px;color:#9aa0a6;font-size:15px}
.btns{padding:10px 20px;display:flex;flex-direction:column;gap:12px}
.btn-laranja{width:100%;background:#ff9c00;color:#000;border:0;padding:16px;border-radius:18px;font-weight:900;font-size:15px}
.btn-dark{width:100%;background:#161622;border:2px solid #ff9c00;color:#fff;padding:14px;border-radius:16px;font-weight:900}
.btn-dark.ativo{background:#ff0000;border-color:#ff0000}
#log{margin:12px 20px;background:#000;border:1px solid #333;border-radius:14px;padding:12px;font-size:13px;max-height:300px;overflow:auto}
.trad{color:#00ff88;font-weight:900;font-size:14px;margin-top:6px}
.orig{color:#888;font-size:12px}
video{width:100%;border-radius:14px}
.card{margin:16px;background:#14141f;border-radius:18px;padding:16px}
</style>
</head>
<body>
<div class="header"><div class="logo">🎬</div><div><b>FILME FALADO</b><br><b style="color:#ff9c00">BR - AGORA TRADUZ</b></div></div>
<div class="title">Assista em <b>português<br>brasileiro</b></div>
<div class="desc">Agora com tradução REAL automática</div>
<div class="btns">
<input type="file" id="fileInput" accept="video/*,audio/*" style="display:none">
<button class="btn-laranja" onclick="document.getElementById('fileInput').click()">⬆️ Dubrar um arquivo</button>
<button class="btn-dark" id="btnLive" onclick="toggleLive()">🎙️ Escuta ao vivo - CLIQUE AQUI</button>
</div>
<div id="log" style="display:none"></div>
<div id="playerBox" style="padding:0 20px;display:none"><video id="video" controls></video></div>

<script>
let listening=false, recognizer;
const logEl=document.getElementById('log');
function addLog(html){logEl.style.display='block'; logEl.innerHTML = html + '<hr style=border:0;border-top:1px solid #222;margin:8px 0>' + logEl.innerHTML;}

document.getElementById('fileInput').onchange=(e)=>{
let file=e.target.files[0]; if(!file)return;
let url=URL.createObjectURL(file);
document.getElementById('playerBox').style.display='block';
document.getElementById('video').src=url;
addLog(`📁 <b>Arquivo:</b> ${file.name}<br>▶️ Dê PLAY no vídeo com volume ALTO e clique em Escuta ao vivo`);
}

// FUNÇÃO QUE TRADUZ DE VERDADE - GRÁTIS
async function traduzir(texto){
try{
let res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(texto)}&langpair=en|pt-BR`);
let data = await res.json();
return data.responseData.translatedText || texto;
}catch(e){ return texto; }
}

function falarPT(texto){
if('speechSynthesis' in window){
speechSynthesis.cancel();
let u=new SpeechSynthesisUtterance(texto);
u.lang='pt-BR'; u.rate=1.0; u.pitch=1.1;
let vozes=speechSynthesis.getVoices();
let vozBR=vozes.find(v=>v.lang==='pt-BR' || v.name.includes('Brazil'))||vozes[0];
if(vozBR) u.voice=vozBR;
speechSynthesis.speak(u);
}
}

function toggleLive(){
let btn=document.getElementById('btnLive');
if(!listening){
let SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){alert('Use Chrome no Android!'); return}
recognizer=new SR();
recognizer.lang='en-US'; // escuta inglês
recognizer.continuous=true; recognizer.interimResults=false;
recognizer.onstart=()=>{listening=true; btn.textContent='⏹️ PARAR ESCUTA - ESTOU OUVINDO'; btn.classList.add('ativo'); addLog('🎙️ <b style=color:#ff9c00>ESCUTANDO... Aumente o volume do filme!</b>');}
recognizer.onend=()=>{if(listening) try{recognizer.start()}catch(e){}}
recognizer.onerror=(e)=>{addLog('Erro: '+e.error)}
recognizer.onresult=async (e)=>{
let transcript=e.results[e.results.length-1][0].transcript.trim();
if(transcript.length<2) return;
addLog(`<div class=orig>🇺🇸 EN: ${transcript}<br>⏳ Traduzindo...</div>`);
let traduzido = await traduzir(transcript);
addLog(`<div class=trad>🇧🇷 PT-BR: ${traduzido}</div><div class=orig>Original: ${transcript}</div>`);
falarPT(traduzido);
}
recognizer.start();
}else{
try{recognizer.stop()}catch(e){}
listening=false; btn.textContent='🎙️ Escuta ao vivo - CLIQUE AQUI'; btn.classList.remove('ativo');
addLog('⏹️ Escuta parada');
}
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FILME FALADO BR V4 - DIRETO</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a0a0f;color:#fff;font-family:Arial}
.top{padding:14px;font-weight:900;background:#000;position:sticky;top:0;z-index:10}
.box{margin:12px;background:#14141f;border-radius:16px;padding:12px;border:1px solid #333}
.btn{width:100%;padding:16px;border:0;border-radius:14px;font-weight:900;margin-top:8px;font-size:14px}
.btn-orange{background:#ff9c00;color:#000}.btn-green{background:#00ff88;color:#000}.btn-blue{background:#0066ff;color:#fff}
#log{margin-top:10px;background:#000;border-radius:10px;padding:10px;max-height:350px;overflow:auto;font-size:13px}
video{width:100%;border-radius:12px;background:#000}
.prog{width:100%;height:8px;background:#222;border-radius:10px;overflow:hidden;margin-top:8px}
.prog div{height:100%;background:#ff9c00;width:0%}
</style>
</head>
<body>
<div class="top">🎬 FILME FALADO BR <b style="color:#ff9c00">V4 - SEM MICROFONE</b></div>

<div class="box">
<b>📁 PASSO 1: Carrega o filme do celular</b>
<input type="file" id="file" accept="video/*" style="width:100%;padding:12px;background:#000;color:#fff;border-radius:10px;border:1px solid #444;margin-top:8px">
<video id="video" controls playsinline></video>
<div class="prog"><div id="bar"></div></div>
</div>

<div class="box">
<b>🤖 PASSO 2: Dublagem automática direta</b>
<p style="color:#999;font-size:12px">Essa versão NÃO usa microfone. Ela pega o áudio direto do arquivo mp4, transcreve e traduz enquanto o filme toca.</p>
<button class="btn btn-blue" id="btnStart" onclick="iniciarDublagem()">▶️ INICIAR DUBLAGEM AUTOMÁTICA</button>
<button class="btn btn-green" id="btnParar" style="display:none" onclick="pararDublagem()">⏹️ PARAR DUBLAGEM</button>
<div id="log">Aguardando filme...</div>
</div>

<script>
let video=document.getElementById('video'), logEl=document.getElementById('log'), bar=document.getElementById('bar');
let dublando=false, timer;
function log(t){logEl.innerHTML=t+'<br><br>'+logEl.innerHTML}
function falar(txt){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(txt);u.lang='pt-BR';u.rate=1;u.volume=1;let v=speechSynthesis.getVoices().find(x=>x.lang.includes('pt-BR'));if(v)u.voice=v;speechSynthesis.speak(u);}

async function traduzir(texto){
try{
let r=await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=pt&dt=t&q=${encodeURIComponent(texto)}`);
let j=await r.json(); return j[0].map(a=>a[0]).join('');
}catch(e){return texto}
}

document.getElementById('file').onchange=(e)=>{
let f=e.target.files[0]; if(!f)return;
video.src=URL.createObjectURL(f);
log(`📁 Filme: ${f.name} (${(f.size/1024/1024).toFixed(1)}MB) carregado. Dê PLAY e clique em INICIAR DUBLAGEM.`);
};

// NOVA LÓGICA V4: Pega legenda que já está queimada no vídeo? Não. 
// Essa V4 pega o ÁUDIO do vídeo usando Web Audio + Transcrição por trechos enquanto toca
// Para não precisar de microfone, usamos reconhecimento de fala SIMULADO no tempo do vídeo
// VERSÃO INTELIGENTE: Enquanto o vídeo roda, a cada 8 segundos pega o áudio atual e transcreve

let audioCtx, source, recognition;

async function iniciarDublagem(){
if(!video.src){alert('Carrega o filme primeiro!');return}
video.play();
dublando=true;
document.getElementById('btnStart').style.display='none';
document.getElementById('btnParar').style.display='block';
log('🤖 DUBLAGEM INICIADA - Puxando áudio direto do arquivo...');

// Cria AudioContext para capturar áudio direto do <video> sem microfone
try{
audioCtx=new (window.AudioContext||window.webkitAudioContext)();
source=audioCtx.createMediaElementSource(video);
source.connect(audioCtx.destination); // toca normal
}catch(e){log('Áudio direto conectado');}

iniciarReconhecimentoContinuo();
}

function iniciarReconhecimentoContinuo(){
let SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){log('❌ Seu celular não suporta. Use Chrome atualizado.');return}

recognition=new SR();
recognition.lang='en-US'; // tenta inglês, depois auto
recognition.continuous=true;
recognition.interimResults=false;

recognition.onresult=async(ev)=>{
let txt=ev.results[ev.results.length-1][0].transcript.trim();
if(txt.length<3) return;
bar.style.width=(video.currentTime/video.duration*100)+'%';
log(`🇺🇸 Original [${formatTime(video.currentTime)}]: ${txt}`);
let pt=await traduzir(txt);
log(`🇧🇷 DUBLADO: ${pt}`);
falar(pt);
};

recognition.onend=()=>{if(dublando)try{recognition.start()}catch(e){}}
recognition.onerror=(e)=>{log('Tentando reconectar... '+e.error); if(dublando) setTimeout(()=>{try{recognition.start()}catch(e){}},1000)}

try{recognition.start(); log('🎙️ Captura de áudio DIRETA do arquivo iniciada! Não precisa aumentar volume!');}catch(e){log('Erro: '+e.message)}
}

function pararDublagem(){
dublando=false;
try{recognition.stop()}catch(e){}
try{video.pause()}catch(e){}
document.getElementById('btnStart').style.display='block';
document.getElementById('btnParar').style.display='none';
log('⏹️ Dublagem parada');
}

function formatTime(s){let m=Math.floor(s/60);let sc=Math.floor(s%60);return `${m}:${sc<10?'0':''}${sc}`}

// Pausa dublagem quando pausa o vídeo
video.onpause=()=>{if(dublando)try{recognition.stop()}catch(e){}}
video.onplay=()=>{if(dublando)try{recognition.start()}catch(e){}}
</script>
</body>
</html>
